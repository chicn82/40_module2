<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>Câu hỏi ôn thi Module 2 – 40 câu trắc nghiệm</title><style>
:root{--bg:#f3f6fb;--panel:#fff;--text:#152033;--muted:#64748b;--line:#dbe3ef;--primary:#175cd3;--ok:#067647;--bad:#b42318;--warn:#b54708;--shadow:0 12px 32px rgba(20,32,51,.08);--radius:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:15px/1.55 Inter,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.topin{max-width:1500px;margin:auto;padding:11px 20px;display:flex;align-items:center;gap:14px}.brand{font-weight:900;font-size:18px;white-space:nowrap}.brand span{color:var(--primary)}.progresswrap{flex:1;height:10px;background:#e8eef7;border-radius:999px;overflow:hidden}.progressbar{height:100%;width:0;background:linear-gradient(90deg,var(--primary),#53a0ff);transition:.25s}.timer{font-variant-numeric:tabular-nums;font-weight:800;min-width:82px;text-align:right}.timer.warn{color:var(--bad)}
.layout{max-width:1500px;margin:auto;display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;padding:20px}
.sidebar{position:sticky;top:72px;height:calc(100vh - 92px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#eef2f7;border-radius:12px;padding:4px;gap:4px;margin-bottom:6px}.seg button{border:0;border-radius:9px;padding:9px;font-weight:800;background:transparent;color:#53657b;cursor:pointer}.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(20,32,51,.12)}
.lbl{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.side-title{font-weight:900;margin:14px 0 10px}.search,.select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}.search{margin-top:10px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.checkrow{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:650;margin-top:4px;cursor:pointer}.checkrow input{accent-color:var(--primary)}
.btn{border:0;border-radius:11px;padding:10px 13px;cursor:pointer;font-weight:750;background:#eaf1fb;color:#17406f}.btn.primary{background:var(--primary);color:#fff}.btn.danger{background:#fff1f0;color:var(--bad)}.btn.ghost{background:#fff;border:1px solid var(--line)}.btn.active{background:#dbeafe;color:#0b4db3;border-color:#9fbceb}
.navgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.navbtn{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-weight:800;color:#516174;position:relative;font-size:12px;padding:0}.navbtn.answered{background:#eaf2ff;border-color:#8db8ff;color:#174f9e}.navbtn.correct{background:#e8f7ef;border-color:#7ad1a7;color:var(--ok)}.navbtn.wrong{background:#fff0ee;border-color:#f3a49d;color:var(--bad)}.navbtn.flagged:after{content:"★";position:absolute;right:1px;top:-5px;color:#d97706;font-size:10px}
.stats{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.hero{background:linear-gradient(135deg,#0f4fbf,#2078e8);color:#fff;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:16px}.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;opacity:.94}
.sessgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px;margin-bottom:16px}
.sesscard{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:0 4px 14px rgba(20,32,51,.05);color:var(--text)}.sesscard:hover{border-color:#9fbceb}.sesscard.on{border-color:var(--primary);box-shadow:0 0 0 2px #cfe0fb}
.sesscard .k{font-size:12px;font-weight:850;color:var(--primary);text-transform:uppercase;letter-spacing:.04em}.sesscard .t{font-weight:750;font-size:14px;line-height:1.3;margin:3px 0 9px;min-height:36px}.sesscard .m{font-size:12px;color:var(--muted);margin-top:6px}
.mini-bar{height:8px;background:#e8eef7;border-radius:999px;overflow:hidden;display:block}.mini-fill{height:100%;background:var(--primary);display:block}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 16px}
.summary{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}.summary h2{margin-top:0}
details.sumd{border:1px solid var(--line);border-radius:14px;margin:8px 0;background:#fbfdff}details.sumd>summary{cursor:pointer;padding:12px 15px;font-weight:800;color:#124b99}details.sumd .summary-grid{padding:0 12px 12px}
.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sum-card{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}.sum-card h3{margin:0 0 8px;color:#124b99;font-size:16px}.sum-card ul{margin:0;padding-left:19px}.sum-card li{margin:5px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;font-weight:700;font-size:13px;background:#fff}.chip input{accent-color:var(--primary)}
.setup-row{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin-top:16px}.setup-row .select{width:auto;min-width:170px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:16px;scroll-margin-top:80px}
.qhead{display:flex;gap:12px}.qnum{flex:none;width:42px;height:42px;border-radius:13px;background:#eaf2ff;color:var(--primary);display:grid;place-items:center;font-weight:900}.qtitle{font-size:17px;font-weight:780}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{border-radius:999px;padding:3px 9px;background:#eef2f7;color:#53657b;font-size:12px;font-weight:750}.tag.sess{background:#eaf2ff;color:#174f9e}
.options{display:grid;gap:9px;margin-top:18px}.option{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:13px;padding:12px 14px;cursor:pointer;background:#fff}.option:hover{border-color:#9fbceb;background:#f8fbff}.option input{margin-top:4px;accent-color:var(--primary);transform:scale(1.08)}.option.selected{border-color:var(--primary);background:#f1f6ff}.option.correct{border-color:#62c798;background:#edf9f3}.option.wrong{border-color:#ef8f86;background:#fff2f0}.letter{font-weight:900;color:#41536a;min-width:20px}
.qactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.feedback{margin-top:15px;padding:14px;border-radius:13px;border-left:5px solid}.feedback.ok{background:#ecf9f2;border-color:var(--ok)}.feedback.bad{background:#fff1ef;border-color:var(--bad)}.feedback.info{background:#fff7e8;border-color:var(--warn)}.explain{margin-top:8px;color:#3f5065}.memory{margin-top:9px;padding:9px 11px;border-radius:9px;background:#f4f7fb;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.footerbar{position:sticky;bottom:0;z-index:15;background:rgba(255,255,255,.97);border:1px solid var(--line);box-shadow:0 -10px 30px rgba(20,32,51,.08);border-radius:15px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal{position:fixed;inset:0;background:rgba(7,18,38,.62);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:26px}
.scorecircle{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:16px auto;background:#e9eef6}.scoreinner{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-weight:900;font-size:24px;line-height:1.2}
.summarygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summarybox{border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center}
.topic-row{display:grid;grid-template-columns:minmax(150px,1.3fr) 2fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.hidden{display:none!important}.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:25px;text-align:center;color:var(--muted)}
@media(max-width:940px){.layout{grid-template-columns:1fr;padding:12px}.sidebar{position:relative;top:auto;height:auto;max-height:480px}.navgrid{grid-template-columns:repeat(10,1fr)}.summary-grid{grid-template-columns:1fr}}
@media(max-width:600px){.navgrid{grid-template-columns:repeat(7,1fr)}.card{padding:16px}.summarygrid{grid-template-columns:1fr}.footerbar{align-items:stretch;flex-direction:column}.topic-row{grid-template-columns:1fr 1fr 50px}.brand span{display:none}.hero h1{font-size:21px}}
@media print{.top,.sidebar,.toolbar,.footerbar,.qactions,.sessgrid{display:none!important}.layout{display:block;padding:0}.card{box-shadow:none;break-inside:avoid}}
</style></head><body>
<header class="top"><div class="topin"><div class="brand">ML/DL <span>Câu hỏi ôn thi Module 2</span></div><div class="progresswrap"><div class="progressbar" id="progressbar"></div></div><div class="timer" id="timer">00:00:00</div></div></header>

  <label class="lbl" for="sessSelect">Buổi</label><select id="sessSelect" class="select"></select>

  <div class="filters"><button class="btn ghost active" data-filter="all">Tất cả</button><button class="btn ghost" data-filter="unanswered">Chưa trả lời</button><button class="btn ghost" data-filter="wrong">Câu sai</button><button class="btn ghost" data-filter="flagged">Đánh dấu</button><button class="btn ghost" data-filter="multi">Chọn nhiều</button><button class="btn ghost" data-filter="unchecked">Chưa kiểm tra</button></div>

<main>

 <section class="summary hidden" id="examSetup">
  <h2>Tạo đề thi thử</h2>

  <div class="lbl">Chọn buổi</div><div class="chips" id="examChips"></div>

   <div><label class="lbl" for="examCount">Số câu</label><select id="examCount" class="select"><option>10</option><option selected>20</option><option>30</option><option value="999">Tất cả câu của các buổi đã chọn</option></select></div>
   <div><label class="lbl" for="examTime">Thời gian</label><select id="examTime" class="select"><option value="60" selected>1 phút / câu</option><option value="45">45 giây / câu</option><option value="90">1,5 phút / câu</option><option value="0">Không giới hạn</option></select></div>

</main></div>
<div class="modal" id="resultModal"><div class="modalbox"><h2 style="text-align:center;margin:0" id="resultTitle">Kết quả bài làm</h2><div class="scorecircle" id="scorecircle"><div class="scoreinner" id="scoreinner"></div></div><div class="summarygrid"><div class="summarybox"><b id="correctCount">0</b><br>Đúng</div><div class="summarybox"><b id="wrongCount">0</b><br>Sai</div><div class="summarybox"><b id="blankCount">0</b><br>Chưa trả lời</div></div><p id="resultMessage" style="text-align:center"></p><div id="topicResults"></div><div style="text-align:center;margin-top:18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" id="reviewWrong">Xem lại câu sai</button><button class="btn primary" id="closeModal">Xem lại bài</button></div></div></div>
<script>
const DATA=[{"b": 1, "title": "Học có giám sát Phần 1", "sub": "Tuyến tính, Cây và Ensemble", "summary": "<div class=\"sum-card\"><h3>1. Supervised Learning<\/h3><ul><li>Dữ liệu có dạng D={(xᵢ,yᵢ)}; X là ma trận đặc trưng, y là target.<\/li><li>Regression dự đoán giá trị liên tục; Classification dự đoán lớp/nhãn rời rạc.<\/li><li>Training set học tham số; Validation set chọn cấu hình/hyperparameter; Test set dùng đánh giá cuối.<\/li><li>Generalization = dự đoán tốt trên dữ liệu chưa từng thấy. Train score cao chưa đủ.<\/li><li>Data leakage xảy ra khi thông tin tương lai/test vô tình đi vào training.<\/li><li>Mục tiêu chọn độ phức tạp giảm lỗi validation/test, tránh underfitting và overfitting.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>2. Linear Regression<\/h3><ul><li>Mô hình: ŷ = w₁x₁ + … + w_d x_d + b.<\/li><li>Residual: eᵢ = yᵢ − ŷᵢ. MSE = (1/n)Σ(yᵢ−ŷᵢ)².<\/li><li>Gradient Descent cập nhật w ← w − η∇J; η là learning rate.<\/li><li>Phù hợp với target liên tục và quan hệ có thể xấp xỉ tuyến tính; là baseline dễ diễn giải.<\/li><li>Residual có pattern rõ → quan hệ tuyến tính chưa mô tả hết dữ liệu.<\/li><li>Feature engineering (ví dụ thêm x²) cho phép linear model tạo quan hệ cong nhưng vẫn tuyến tính theo tham số.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>3. Logistic Regression<\/h3><ul><li>Dùng cho classification dù tên có chữ Regression.<\/li><li>Linear score: z = wᵀx+b; sigmoid σ(z)=1/(1+e⁻ᶻ) biến score thành xác suất (0,1).<\/li><li>Threshold biến xác suất thành nhãn; threshold không bắt buộc bằng 0.5.<\/li><li>Threshold giảm → nhiều positive prediction hơn; threshold tăng → thận trọng hơn khi gán positive.<\/li><li>Binary cross-entropy/log-loss phạt mạnh dự đoán rất tự tin nhưng sai.<\/li><li>Odds = p/(1−p); log-odds = wᵀx+b. Coefficient tác động lên log-odds khi giữ feature khác cố định.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>4. Regularization L1/L2<\/h3><ul><li>Objective = Data Loss + λ×Penalty; λ điều khiển độ mạnh regularization.<\/li><li>L1: Σ|wⱼ|, có thể đưa một số weight về đúng 0 → hỗ trợ feature selection.<\/li><li>L2: Σwⱼ², thường thu nhỏ weight nhưng ít khi ép đúng 0 → tăng ổn định.<\/li><li>λ≈0: dễ overfit; λ quá lớn: dễ underfit; chọn λ bằng validation/Cross-Validation.<\/li><li>Feature scaling quan trọng vì penalty tác động trực tiếp lên độ lớn weight.<\/li><li>Standardization thường dùng: x′=(x−μ)/σ trước Linear/Logistic Regression có regularization.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>5. Decision Tree<\/h3><ul><li>Node tìm feature + threshold để chia dữ liệu thành các nhánh sạch hơn theo target.<\/li><li>Classification có thể dùng Gini/Entropy; Gini = 1−Σpₖ².<\/li><li>Split tốt làm impurity giảm nhiều; G_split là impurity có trọng số theo số mẫu ở các nhánh.<\/li><li>Ưu điểm: dễ giải thích, không cần scaling, mô hình hóa phi tuyến. Hạn chế: dễ overfit nếu cây quá sâu.<\/li><li>Hyperparameter quan trọng: max_depth, min_samples_split, min_samples_leaf.<\/li><li>Pre-pruning dừng cây sớm; post-pruning xây cây lớn rồi cắt nhánh ít hữu ích.<\/li><li>Regression Tree trả về giá trị liên tục; tiêu chí split thường liên quan giảm variance/MSE.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>6. Random Forest &amp; Bagging<\/h3><ul><li>Random Forest = nhiều Decision Tree rồi tổng hợp dự đoán.<\/li><li>Classification: majority voting; Regression: averaging.<\/li><li>Hai nguồn randomness: bootstrap sampling và random subset of features tại mỗi split.<\/li><li>Mục tiêu tạo các cây khác nhau hơn để giảm tương quan lỗi và tăng ổn định.<\/li><li>OOB sample là training sample không được chọn vào bootstrap của một cây; có thể dùng để ước lượng validation.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>7. Boosting &amp; XGBoost<\/h3><ul><li>Boosting xây learner tuần tự; cây sau tập trung khắc phục sai số cây trước.<\/li><li>Bagging: learner tương đối độc lập; Boosting: learner nối tiếp và cộng dần đóng góp.<\/li><li>XGBoost hyperparameter trọng tâm: learning_rate, max_depth, n_estimators, subsample.<\/li><li>Learning rate nhỏ → mỗi cây đóng góp ít hơn → thường cần nhiều cây hơn.<\/li><li>Quá nhiều cây/cây quá phức tạp có thể tăng overfitting.<\/li><li>Objective XGBoost vừa fit dữ liệu vừa regularize cấu trúc/leaf weight; γ phạt thêm leaf, λ phạt leaf weight lớn.<\/li><li>Các tham số như min_child_weight, colsample_bytree cùng ảnh hưởng độ phức tạp/generalization.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>8. Bản đồ lựa chọn mô hình<\/h3><ul><li>Linear Regression: baseline tuyến tính cho target liên tục.<\/li><li>Logistic Regression: baseline tuyến tính cho binary classification.<\/li><li>Decision Tree: dễ giải thích, linh hoạt, nhưng dễ overfit.<\/li><li>Random Forest: bagging nhiều cây để tăng ổn định.<\/li><li>XGBoost: boosting tuần tự, mạnh nhưng nhiều hyperparameter cần kiểm soát.<\/li><li>Pipeline lab: Load data → Prepare → Train/Test Split → XGBoost Baseline → Evaluate → Tune → Compare.<\/li><\/ul><\/div>", "questions": [{"n": 1, "text": "Trong học có giám sát, bài toán dự đoán doanh thu của thuê bao trong tháng tới thuộc loại nào?", "options": [{"text": "Regression vì giá trị mục tiêu là một đại lượng liên tục"}, {"text": "Classification vì giá trị mục tiêu là một đại lượng liên tục"}, {"text": "Regression vì giá trị mục tiêu là một nhãn rời rạc"}, {"text": "Classification vì giá trị mục tiêu là một nhãn rời rạc"}], "answer": [0], "multi": false, "topic": "Supervised Learning", "explanation": "Doanh thu là đại lượng số liên tục, nên đây là bài toán Regression. Classification chỉ dùng khi target là nhãn rời rạc.", "memory": "Liên tục → Regression; nhãn rời rạc → Classification."}, {"n": 2, "text": "Trong quá trình chia dữ liệu train, validation và test, validation set chủ yếu được dùng để làm gì?", "options": [{"text": "Học các tham số của mô hình từ dữ liệu huấn luyện"}, {"text": "Chọn cấu hình của mô hình trước khi đánh giá cuối"}, {"text": "Đánh giá cuối cùng của mô hình sau khi chọn cấu hình"}, {"text": "Học lại các tham số của mô hình sau khi đánh giá cuối"}], "answer": [1], "multi": false, "topic": "Supervised Learning", "explanation": "Train dùng để học tham số; validation dùng để chọn cấu hình/hyperparameter; test chỉ dùng đánh giá cuối cùng.", "memory": "Train → learn; Val → choose; Test → final."}, {"n": 3, "text": "Với Logistic Regression, nếu giảm decision threshold thì điều gì thường xảy ra?", "options": [{"text": "Nhiều mẫu hơn được dự đoán thuộc lớp positive"}, {"text": "Ít mẫu hơn được dự đoán thuộc lớp positive"}, {"text": "Số mẫu positive luôn giữ nguyên sau khi đổi threshold"}, {"text": "Xác suất dự đoán của mọi mẫu đều giảm theo threshold"}], "answer": [0], "multi": false, "topic": "Logistic Regression", "explanation": "Hạ threshold làm nhiều mẫu có xác suất vượt ngưỡng hơn, nên số dự đoán positive tăng. Xác suất dự đoán của mô hình không đổi, chỉ ngưỡng thay đổi.", "memory": ""}, {"n": 4, "text": "Điểm nào mô tả đúng nhất cách Random Forest tạo ra dự đoán?", "options": [{"text": "Huấn luyện tuần tự nhiều cây để cây sau sửa lỗi cây trước"}, {"text": "Huấn luyện nhiều cây khác nhau rồi tổng hợp dự đoán của các cây"}, {"text": "Huấn luyện một cây rất sâu rồi trung bình dự đoán giữa các leaf"}, {"text": "Huấn luyện nhiều cây giống nhau rồi chọn dự đoán của cây tốt nhất"}], "answer": [1], "multi": false, "topic": "Random Forest & Boosting", "explanation": "Random Forest huấn luyện nhiều cây khác nhau (bootstrap + random feature subset) rồi tổng hợp bằng voting/averaging. Huấn luyện tuần tự để sửa lỗi là Boosting.", "memory": "Bagging: song song, tổng hợp; Boosting: tuần tự, sửa lỗi."}, {"n": 5, "text": "Một mô hình Logistic Regression dùng L1/L2 regularization có hai feature với thang đo rất khác nhau: x1 nằm trong [0,1], còn x2 nằm trong [0,10^6]. Vì sao nên standardize các feature trước khi huấn luyện?", "options": [{"text": "Vì regularization chỉ hoạt động khi mọi feature có cùng giá trị trung bình"}, {"text": "Vì regularization chỉ hoạt động khi mọi feature có cùng số lượng giá trị"}, {"text": "Vì penalty tác động lên độ lớn weight nên thang đo khác nhau có thể gây mất cân bằng"}, {"text": "Vì penalty tác động lên giá trị feature nên thang đo khác nhau làm target bị thay đổi"}], "answer": [2], "multi": false, "topic": "Regularization L1/L2", "explanation": "Penalty L1/L2 tác động trực tiếp lên độ lớn weight. Feature có thang đo lớn cần weight nhỏ và ngược lại, nên nếu không standardize thì penalty phạt không cân bằng giữa các feature.", "memory": ""}]}, {"b": 2, "title": "Học có giám sát Phần 2", "sub": "SVM, KNN và Feature Engineering", "summary": "<div class=\"sum-card\"><h3>1. Support Vector Machine (SVM)<\/h3><ul><li>SVM tìm decision boundary phân tách các lớp; trong nhiều chiều boundary là hyperplane wᵀx+b=0.<\/li><li>Margin là khoảng cách từ boundary tới các điểm gần biên nhất; SVM ưu tiên margin lớn.<\/li><li>Support vectors là các điểm gần boundary nhất và ảnh hưởng mạnh tới vị trí/hướng của boundary.<\/li><li>Soft margin cho phép vi phạm margin hoặc phân loại sai. C lớn phạt lỗi mạnh; C nhỏ cho phép margin rộng hơn.<\/li><li>Linear kernel phù hợp khi boundary gần tuyến tính; RBF phù hợp khi quan hệ phi tuyến.<\/li><li>Với RBF, γ lớn làm ảnh hưởng rất cục bộ và boundary dễ gấp khúc; γ nhỏ tạo boundary mượt hơn.<\/li><li>SVM rất nhạy với scaling; thường dùng StandardScaler hoặc MinMaxScaler trước khi train.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>2. K-Nearest Neighbors (KNN)<\/h3><ul><li>KNN dự đoán dựa trên K điểm training gần sample mới nhất; classification dùng voting, regression dùng averaging.<\/li><li>Euclidean distance: d(x,z)=√Σ(xⱼ−zⱼ)². Feature thang đo lớn có thể chi phối khoảng cách.<\/li><li>K nhỏ: boundary linh hoạt, dễ bắt local pattern nhưng dễ nhiễu/overfit.<\/li><li>K lớn: ổn định hơn nhưng có thể quá đơn giản/underfit.<\/li><li>Uniform voting cho mọi láng giềng trọng số như nhau; distance-weighted voting ưu tiên láng giềng gần.<\/li><li>KNN gần như luôn cần scaling khi numerical feature có đơn vị/thang đo khác nhau.<\/li><li>Số chiều cao làm khái niệm gần/xa kém rõ → feature selection hoặc dimensionality reduction có thể hữu ích.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>3. Scaling<\/h3><ul><li>Scaling giúp feature numerical đóng góp cân bằng hơn và giúp một số thuật toán tối ưu ổn định hơn.<\/li><li>StandardScaler: z=(x−μ)/σ; sau scale mean gần 0, standard deviation gần 1.<\/li><li>MinMaxScaler: x&#x27;=(x−xmin)/(xmax−xmin), thường đưa dữ liệu về [0,1], nhưng nhạy với outlier.<\/li><li>RobustScaler dùng median và IQR, ít bị outlier kéo hơn StandardScaler/MinMaxScaler.<\/li><li>KNN và SVM rất cần scaling; Logistic Regression/Neural Network thường cần; mô hình cây ít phụ thuộc scale.<\/li><li>Scaler phải fit trên training set/fold rồi mới transform validation/test để tránh leakage.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>4. Encoding categorical feature<\/h3><ul><li>Categorical feature thường phải chuyển sang dạng số trước khi đưa vào mô hình ML.<\/li><li>Ordinal encoding chỉ phù hợp khi category có thứ tự thật sự; nếu không sẽ tạo thứ tự giả.<\/li><li>One-hot encoding tạo một cột nhị phân cho mỗi category, không áp đặt thứ tự giả nhưng tăng số chiều.<\/li><li>Binary encoding có thể giảm số chiều khi cardinality cao, nhưng biểu diễn có thể tạo quan hệ không trực quan.<\/li><li>Encoding phải phản ánh đúng ý nghĩa nghiệp vụ của feature.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>5. Feature Selection<\/h3><ul><li>Mục tiêu: giảm số feature, loại nhiễu, giảm thời gian train, tăng khả năng giải thích và đôi khi giảm overfitting.<\/li><li>Filter methods chấm điểm feature tương đối độc lập với model: correlation, statistical tests, mutual information.<\/li><li>Wrapper methods thử nhiều subset bằng model; ví dụ RFE; bám sát model nhưng tốn tính toán.<\/li><li>Embedded methods chọn feature trong lúc train; ví dụ L1 và tree-based feature importance.<\/li><li>Feature selection có dùng target phải được fit chỉ trên training fold để tránh leakage.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>6. Pipeline &amp; ColumnTransformer<\/h3><ul><li>Pipeline ghép preprocessing → model → prediction thành một quy trình thống nhất.<\/li><li>ColumnTransformer cho phép xử lý numerical và categorical columns bằng các pipeline khác nhau rồi ghép lại.<\/li><li>Numerical thường gồm impute missing value + scaling; categorical thường gồm impute + encoding.<\/li><li>Pipeline giúp giảm lỗi apply preprocessing không nhất quán và hỗ trợ Cross-Validation/Hyperparameter Tuning.<\/li><li>Trong mỗi CV fold, scaler/imputer/encoder/selector chỉ được fit trên train fold rồi transform validation fold.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>7. Checklist &amp; so sánh mô hình<\/h3><ul><li>Checklist: xác định target → tách numerical/categorical → kiểm tra missing → chọn encoding → chọn scaler → đóng gói Pipeline/ColumnTransformer → chọn metric → so sánh cùng split.<\/li><li>SVM phù hợp dataset vừa/nhỏ, số chiều tương đối lớn, cần boundary rõ; không lý tưởng khi dataset rất lớn và cần train/predict cực nhanh.<\/li><li>KNN phù hợp dataset không quá lớn, local similarity có ý nghĩa, feature đã được xử lý và scale tốt.<\/li><li>So sánh KNN/SVM với baseline cây phải dùng cùng split và cùng metric để công bằng.<\/li><li>Không có mô hình thắng tuyệt đối; cần cân bằng metric, chi phí vận hành, tốc độ và yêu cầu nghiệp vụ.<\/li><\/ul><\/div>", "questions": [{"n": 1, "text": "Trong SVM, margin được hiểu là gì?", "options": [{"text": "Khoảng cách giữa hai điểm bất kỳ thuộc hai lớp khác nhau"}, {"text": "Khoảng cách từ decision boundary tới các điểm gần biên nhất"}, {"text": "Khoảng cách từ decision boundary tới các điểm xa biên nhất"}, {"text": "Khoảng cách giữa các support vector trong cùng một lớp"}], "answer": [1], "multi": false, "topic": "SVM", "explanation": "Margin là khoảng cách từ decision boundary tới các điểm gần biên nhất (support vectors); SVM tìm boundary có margin lớn nhất.", "memory": ""}, {"n": 2, "text": "Trong KNN classification, nhãn của một sample mới thường được xác định như thế nào?", "options": [{"text": "Lấy trung bình nhãn của toàn bộ sample trong training set"}, {"text": "Voting dựa trên K sample gần nhất trong training set"}, {"text": "Voting dựa trên K sample xa nhất trong training set"}, {"text": "Lấy nhãn của toàn bộ sample có cùng giá trị feature"}], "answer": [1], "multi": false, "topic": "KNN", "explanation": "KNN classification tìm K điểm training gần nhất rồi voting theo đa số để gán nhãn cho sample mới.", "memory": "Classification → voting; Regression → averaging."}, {"n": 3, "text": "Sau khi dùng StandardScaler, feature thường có đặc điểm nào?", "options": [{"text": "Mean gần 0 và standard deviation gần 1"}, {"text": "Mean gần 1 và standard deviation gần 0"}, {"text": "Giá trị nhỏ nhất gần 0 và lớn nhất gần 1"}, {"text": "Median gần 0 và interquartile range gần 1"}], "answer": [0], "multi": false, "topic": "Scaling & Encoding", "explanation": "StandardScaler biến đổi z=(x−μ)/σ nên sau scale mean ≈ 0 và standard deviation ≈ 1. Đưa về [0,1] là MinMaxScaler; median/IQR là RobustScaler.", "memory": ""}, {"n": 4, "text": "Ordinal encoding phù hợp nhất với loại categorical feature nào?", "options": [{"text": "Category không có thứ tự nhưng có ít giá trị khác nhau"}, {"text": "Category có thứ tự tự nhiên hoặc thứ tự nghiệp vụ rõ ràng"}, {"text": "Category không có thứ tự nhưng có nhiều giá trị khác nhau"}, {"text": "Category có giá trị liên tục nhưng được lưu dưới dạng chuỗi"}], "answer": [1], "multi": false, "topic": "Scaling & Encoding", "explanation": "Ordinal encoding gán số theo thứ tự, nên chỉ phù hợp khi category có thứ tự tự nhiên/nghiệp vụ (ví dụ thấp < trung bình < cao). Dùng cho category không thứ tự sẽ tạo thứ tự giả.", "memory": ""}, {"n": 5, "text": "Khi đánh giá mô hình bằng Cross-Validation, pipeline gồm imputer, scaler, feature selector và SVM. Quy trình nào đúng nhất để tránh data leakage?", "options": [{"text": "Fit toàn bộ preprocessing trên dataset trước rồi mới chia các fold"}, {"text": "Fit preprocessing trên train fold nhưng fit selector trên toàn bộ dataset"}, {"text": "Fit toàn bộ preprocessing và selector riêng trên train của từng fold"}, {"text": "Fit preprocessing trên train fold nhưng fit scaler thêm trên validation fold"}], "answer": [2], "multi": false, "topic": "Pipeline & Leakage", "explanation": "Mọi bước học từ dữ liệu (imputer, scaler, feature selector) phải fit riêng trên train portion của từng fold rồi mới transform validation fold. Fit trên toàn bộ dataset hoặc trên validation đều gây leakage.", "memory": "Đóng gói vào Pipeline để scikit-learn tự fit đúng trong từng fold."}]}, {"b": 3, "title": "Học không giám sát và tinh chỉnh siêu tham số", "sub": "K-Means, PCA, Anomaly Detection, Grid/Random Search và Optuna", "summary": "<div class=\"sum-card\"><h3>1. Unsupervised Learning<\/h3><ul><li>Unsupervised learning làm việc với dữ liệu không có nhãn mục tiêu y; mục tiêu là khám phá cấu trúc tiềm ẩn.<\/li><li>Ba nhóm bài toán tiêu biểu: clustering, dimensionality reduction và anomaly detection.<\/li><li>Không có nhãn không có nghĩa là không cần đánh giá: cần metric phù hợp, trực quan hóa, inspection và hiểu biết nghiệp vụ.<\/li><li>Cluster không tự động đồng nghĩa với segment nghiệp vụ có ý nghĩa; anomaly score cao không tự động đồng nghĩa với sự cố thật.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>2. K-Means<\/h3><ul><li>K-Means tìm K cụm; mỗi điểm được gán vào centroid gần nhất, sau đó centroid được tính lại và lặp đến hội tụ.<\/li><li>Hàm mục tiêu là giảm tổng khoảng cách bình phương từ điểm tới centroid của cluster tương ứng (within-cluster variance).<\/li><li>Inertia là tổng khoảng cách bình phương tới centroid gần nhất; tăng K thường làm inertia giảm nhưng không nên chọn K chỉ vì inertia nhỏ nhất.<\/li><li>Elbow Method tìm điểm mà tăng thêm K không còn làm inertia giảm đáng kể; Silhouette đánh giá mức phù hợp của điểm với cluster hiện tại so với cluster khác.<\/li><li>K-Means dựa trên khoảng cách nên cần scaling; outlier và cách khởi tạo centroid có thể ảnh hưởng mạnh.<\/li><li>k-means++ giúp giảm rủi ro các centroid khởi tạo quá gần nhau.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>3. PCA<\/h3><ul><li>PCA tạo các trục mới (principal components), không đơn giản là xóa bớt feature gốc.<\/li><li>PC1 là hướng dữ liệu biến thiên mạnh nhất; các PC sau giữ phần biến thiên lớn tiếp theo và vuông góc với các PC trước.<\/li><li>Explained variance ratio cho biết mỗi PC giữ bao nhiêu phần trăm tổng variance; cumulative explained variance giúp chọn số PC cần giữ.<\/li><li>PCA thường cần scaling vì feature có đơn vị lớn có thể có variance số học lớn và chi phối kết quả.<\/li><li>PCA hữu ích cho visualization, giảm feature dư thừa/noise, compression và tạo representation cho mô hình downstream.<\/li><li>Hạn chế: PCA chỉ tìm quan hệ tuyến tính và principal components thường khó diễn giải hơn feature gốc.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>4. Anomaly Detection<\/h3><ul><li>Anomaly detection phát hiện điểm khác biệt đáng kể so với phần lớn dữ liệu; kết quả cần xác minh bằng nghiệp vụ/log/alarm/ground truth nếu có.<\/li><li>Global anomaly khác biệt so với toàn bộ phân phối; local anomaly khác biệt so với vùng lân cận.<\/li><li>Isolation Forest: anomaly thường dễ bị cô lập hơn, nên path length ngắn hơn.<\/li><li>Isolation Forest: n_estimators là số cây; contamination là tỷ lệ anomaly kỳ vọng, không phải độ chính xác.<\/li><li>One-Class SVM học boundary của vùng dữ liệu bình thường; nhạy với scaling và kernel parameter.<\/li><li>LOF so sánh mật độ cục bộ của một điểm với hàng xóm; phù hợp local anomaly và nhạy với số hàng xóm.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>5. Hyperparameter Tuning<\/h3><ul><li>Parameter được mô hình học từ dữ liệu; hyperparameter được chọn trước training.<\/li><li>Grid Search thử toàn bộ tổ hợp trong grid; dễ hiểu và tái lập nhưng nhanh bùng nổ khi không gian lớn.<\/li><li>Random Search lấy mẫu cấu hình theo budget; có thể hiệu quả hơn khi chỉ một số hyperparameter ảnh hưởng mạnh.<\/li><li>Bayesian Optimization/Optuna dùng kết quả các trial trước để ưu tiên vùng hứa hẹn, cân bằng khám phá và khai thác.<\/li><li>Optuna: Study, Trial, Objective function, suggest parameter và direction (minimize/maximize).<\/li><li>Tuning nên kết hợp Cross-Validation; test set chỉ dùng một lần cuối, không tune trực tiếp trên test set.<\/li><li>Budget, metric, validation strategy và baseline phải được xác định rõ; tuning không sửa được feature kém, label sai hay split sai.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>6. Checklist Buổi 3<\/h3><ul><li>1) Dữ liệu có nhãn hay không? 2) Mục tiêu là phân nhóm, giảm chiều hay phát hiện bất thường?<\/li><li>3) Feature có cần scaling không? 4) Metric hoặc cách inspection nào phù hợp?<\/li><li>5) Hyperparameter nào ảnh hưởng lớn nhất? 6) Kết quả có diễn giải được bằng nghiệp vụ không?<\/li><\/ul><\/div>", "questions": [{"n": 1, "text": "Trong K-Means, mỗi điểm dữ liệu thường được gán vào cluster theo nguyên tắc nào?", "options": [{"text": "Gán vào centroid xa nhất so với điểm dữ liệu hiện tại"}, {"text": "Gán vào centroid gần nhất so với điểm dữ liệu hiện tại"}, {"text": "Gán vào centroid lớn nhất theo giá trị feature trung bình"}, {"text": "Gán vào centroid nhỏ nhất theo giá trị feature trung bình"}], "answer": [1], "multi": false, "topic": "K-Means & PCA", "explanation": "Ở bước gán cụm, mỗi điểm được gán vào cluster có centroid gần nhất; sau đó centroid được tính lại bằng trung bình các điểm.", "memory": ""}, {"n": 2, "text": "PCA giảm chiều dữ liệu chủ yếu bằng cách nào?", "options": [{"text": "Xóa trực tiếp các feature có variance nhỏ khỏi dữ liệu ban đầu"}, {"text": "Tạo các principal component mới từ các feature ban đầu"}, {"text": "Giữ nguyên các feature có correlation cao trong dữ liệu ban đầu"}, {"text": "Chọn trực tiếp các feature có giá trị trung bình lớn nhất"}], "answer": [1], "multi": false, "topic": "K-Means & PCA", "explanation": "PCA tạo các principal component mới là tổ hợp tuyến tính của feature gốc, giữ các hướng có variance lớn nhất; không đơn thuần xóa feature.", "memory": ""}, {"n": 3, "text": "Trong Isolation Forest, một điểm thường được xem là bất thường hơn khi nào?", "options": [{"text": "Cần nhiều lần chia hơn để tách điểm khỏi các điểm còn lại"}, {"text": "Cần ít lần chia hơn để tách điểm khỏi các điểm còn lại"}, {"text": "Có khoảng cách bằng nhau tới tất cả các điểm dữ liệu khác"}, {"text": "Có mật độ bằng nhau với tất cả các điểm dữ liệu lân cận"}], "answer": [1], "multi": false, "topic": "Anomaly Detection", "explanation": "Isolation Forest chia dữ liệu ngẫu nhiên; điểm bất thường dễ bị cô lập nên cần ít lần chia hơn (path length ngắn) và có anomaly score cao hơn.", "memory": "Path length ngắn → bất thường hơn."}, {"n": 4, "text": "Điểm khác nhau chính giữa Grid Search và Random Search là gì?", "options": [{"text": "Grid Search thử mọi tổ hợp trong grid, Random Search lấy mẫu ngẫu nhiên"}, {"text": "Grid Search lấy mẫu ngẫu nhiên, Random Search thử mọi tổ hợp trong grid"}, {"text": "Grid Search chỉ thử một cấu hình, Random Search thử toàn bộ cấu hình"}, {"text": "Grid Search tự học vùng tốt, Random Search luôn chọn cấu hình tốt nhất"}], "answer": [0], "multi": false, "topic": "Hyperparameter Tuning", "explanation": "Grid Search thử toàn bộ tổ hợp trong grid đã định; Random Search lấy mẫu ngẫu nhiên một số cấu hình theo budget.", "memory": ""}, {"n": 5, "text": "Một mô hình có không gian hyperparameter rất lớn và ngân sách chỉ cho phép thử số lượng cấu hình hạn chế. Nhóm muốn các lần thử sau tận dụng kết quả của những lần thử trước để ưu tiên vùng hyperparameter hứa hẹn. Phương pháp nào phù hợp nhất?", "options": [{"text": "Grid Search vì mỗi tổ hợp trong không gian được đánh giá theo thứ tự"}, {"text": "Random Search vì mỗi trial mới được lấy mẫu độc lập với trial trước"}, {"text": "Optuna vì trial sau có thể dùng kết quả trước để ưu tiên vùng hứa hẹn"}, {"text": "Grid Search vì trial sau có thể dùng kết quả trước để thu hẹp vùng tìm kiếm"}], "answer": [2], "multi": false, "topic": "Hyperparameter Tuning", "explanation": "Bayesian Optimization/Optuna dùng kết quả các trial trước để ưu tiên vùng hứa hẹn. Grid Search không học từ kết quả trước; Random Search lấy mẫu độc lập.", "memory": ""}]}, {"b": 4, "title": "Đánh giá mô hình và chống Overfitting", "sub": "Generalization, Bias–Variance, Learning Curve, Cross-Validation, Metrics và Imbalanced Data", "summary": "<div class=\"sum-card\"><h3>1. Generalization, Train/Validation/Test<\/h3><ul><li>Generalization là khả năng mô hình hoạt động tốt trên dữ liệu chưa từng thấy; training tốt không đồng nghĩa mô hình tốt.<\/li><li>Train dùng để học tham số; Validation dùng chọn model/hyperparameter/threshold; Test chỉ dùng đánh giá cuối cùng sau khi chốt mô hình.<\/li><li>Generalization gap là chênh lệch performance giữa train và validation/test; gap lớn là dấu hiệu quan trọng của overfitting.<\/li><li>Không nên nhìn test set liên tục trong quá trình lựa chọn mô hình vì test sẽ biến thành một validation set thứ hai.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>2. Underfitting, Overfitting và Bias–Variance<\/h3><ul><li>Underfitting: train kém + validation kém, thường gắn với high bias; xử lý bằng tăng complexity, thêm feature, giảm regularization hoặc kiểm tra dữ liệu.<\/li><li>Overfitting: train rất tốt nhưng validation/test kém hơn rõ rệt, thường gắn với high variance.<\/li><li>Khi tăng model complexity: bias thường giảm nhưng variance thường tăng; mục tiêu là tìm mức complexity phù hợp.<\/li><li>Decision Tree quá sâu có thể high variance; Random Forest giảm variance bằng bagging; hyperparameter là công cụ điều chỉnh bias–variance.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>3. Learning Curve<\/h3><ul><li>Learning curve quan sát performance theo kích thước training set và so sánh đường train với validation.<\/li><li>Train và validation đều thấp, gần nhau → high bias.<\/li><li>Train cao nhưng validation thấp hơn nhiều → high variance.<\/li><li>High variance thường có thể hưởng lợi từ thêm dữ liệu; high bias thường cần đổi model/feature hơn là chỉ thêm data.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>4. Cross-Validation &amp; Data Leakage<\/h3><ul><li>K-Fold: chia dữ liệu thành K fold; mỗi lần dùng K−1 fold train và 1 fold validation; báo cáo mean và standard deviation.<\/li><li>Stratified K-Fold giữ tỷ lệ class trong mỗi fold gần giống toàn bộ dataset, đặc biệt quan trọng khi class imbalance.<\/li><li>Time-Series Split phải giữ thứ tự thời gian: train ở quá khứ, validation/test ở tương lai; không random split thông thường.<\/li><li>Preprocessing, feature selection và resampling phải được fit/chạy bên trong training fold; mọi xử lý học từ dữ liệu chỉ được học từ train.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>5. Classification Metrics<\/h3><ul><li>Confusion Matrix gồm TP, TN, FP, FN. FP là báo động nhầm; FN là bỏ sót.<\/li><li>Accuracy phù hợp hơn khi class tương đối cân bằng và chi phí lỗi gần nhau; có thể đánh lừa khi class imbalance mạnh.<\/li><li>Precision = TP/(TP+FP): trong các mẫu dự đoán positive, bao nhiêu mẫu thật sự positive; quan trọng khi FP tốn kém.<\/li><li>Recall = TP/(TP+FN): trong các positive thật, model bắt được bao nhiêu; quan trọng khi FN tốn kém.<\/li><li>F1 là harmonic mean của Precision và Recall; cao khi cả hai cùng tương đối cao.<\/li><li>Threshold thấp thường làm Recall tăng và FP tăng; threshold cao thường làm Precision tăng và FN tăng.<\/li><li>ROC-AUC đánh giá khả năng phân biệt hai lớp qua nhiều threshold; PR-AUC thường hữu ích hơn khi positive class rất hiếm.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>6. Regression Metrics<\/h3><ul><li>MAE là sai số tuyệt đối trung bình, cùng đơn vị với target, dễ diễn giải và ít nhạy outlier hơn RMSE.<\/li><li>RMSE bình phương sai số trước khi lấy trung bình rồi căn bậc hai; phạt các sai số lớn mạnh hơn và cùng đơn vị với target.<\/li><li>Khi lỗi lớn đặc biệt nguy hiểm, RMSE thường hữu ích; báo cáo song song MAE và RMSE có thể cho góc nhìn đầy đủ hơn.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>7. Imbalanced Data &amp; Resampling<\/h3><ul><li>Imbalanced data là khi tỷ lệ class chênh lệch lớn; Accuracy có thể rất cao dù model bỏ sót hoàn toàn class hiếm.<\/li><li>Các hướng xử lý: metric phù hợp, threshold tuning, class weighting, undersampling, oversampling/SMOTE, thu thập thêm class hiếm.<\/li><li>Class weighting không tạo sample mới; tăng mức phạt cho lỗi ở class thiểu số.<\/li><li>Undersampling giảm class đa số nhưng có nguy cơ mất thông tin; oversampling có thể overfit minority.<\/li><li>SMOTE tạo sample tổng hợp giữa các minority samples gần nhau; chỉ áp dụng trên training data/training fold, không trên validation/test.<\/li><\/ul><\/div>", "questions": [{"n": 1, "text": "Generalization trong Machine Learning được hiểu là gì?", "options": [{"text": "Khả năng mô hình ghi nhớ chính xác dữ liệu dùng để huấn luyện"}, {"text": "Khả năng mô hình hoạt động tốt trên dữ liệu chưa từng thấy"}, {"text": "Khả năng mô hình đạt điểm cao nhất trên tập dữ liệu training"}, {"text": "Khả năng mô hình giảm loss liên tục trong quá trình huấn luyện"}], "answer": [1], "multi": false, "topic": "Generalization & Overfitting", "explanation": "Generalization là khả năng mô hình hoạt động tốt trên dữ liệu chưa từng thấy, không phải điểm cao trên training.", "memory": ""}, {"n": 2, "text": "Dấu hiệu nào thường cho thấy mô hình đang overfitting?", "options": [{"text": "Training và validation đều có performance thấp tương đương nhau"}, {"text": "Training rất tốt nhưng validation kém hơn một khoảng đáng kể"}, {"text": "Training và validation đều có performance cao tương đương nhau"}, {"text": "Training thấp hơn validation nhưng khoảng cách giữa hai tập nhỏ"}], "answer": [1], "multi": false, "topic": "Generalization & Overfitting", "explanation": "Overfitting: training rất tốt nhưng validation kém hơn rõ rệt (generalization gap lớn). Train và validation cùng thấp là underfitting.", "memory": ""}, {"n": 3, "text": "Với bài toán classification có class mất cân bằng, phương pháp Cross-Validation nào phù hợp nhất?", "options": [{"text": "K-Fold vì chia số lượng mẫu bằng nhau giữa các fold"}, {"text": "Stratified K-Fold vì giữ gần đúng tỷ lệ class trong mỗi fold"}, {"text": "Time-Series Split vì giữ nguyên thứ tự các mẫu trong dataset"}, {"text": "Holdout Split vì chỉ cần chia dữ liệu thành hai tập cố định"}], "answer": [1], "multi": false, "topic": "Cross-Validation & Metrics", "explanation": "Stratified K-Fold giữ tỷ lệ class trong mỗi fold gần giống toàn bộ dataset, quan trọng khi class mất cân bằng.", "memory": ""}, {"n": 4, "text": "Khi positive class rất hiếm, metric nào thường hữu ích để đánh giá trực tiếp chất lượng dự đoán class positive?", "options": [{"text": "Accuracy vì đo tỷ lệ dự đoán đúng trên toàn bộ dữ liệu"}, {"text": "ROC-AUC vì chỉ tập trung vào các mẫu thuộc class positive"}, {"text": "PR-AUC vì tập trung vào trade-off giữa Precision và Recall"}, {"text": "RMSE vì phạt mạnh những dự đoán sai trên class positive"}], "answer": [2], "multi": false, "topic": "Cross-Validation & Metrics", "explanation": "PR-AUC tập trung vào trade-off Precision–Recall của class positive nên hữu ích khi positive rất hiếm. Accuracy dễ đánh lừa khi imbalance; RMSE là metric regression.", "memory": ""}, {"n": 5, "text": "Một bài toán churn chỉ có 5% khách hàng thuộc class churn. Nhóm sử dụng 5-Fold Cross-Validation và muốn áp dụng SMOTE để xử lý mất cân bằng. Quy trình nào đúng nhất để tránh data leakage?", "options": [{"text": "Áp dụng SMOTE trên toàn bộ dataset rồi mới chia thành 5 fold"}, {"text": "Áp dụng SMOTE trên mỗi validation fold rồi huấn luyện trên train fold"}, {"text": "Áp dụng SMOTE riêng trên training portion của từng fold rồi đánh giá trên validation fold gốc"}, {"text": "Áp dụng SMOTE trên cả training và validation portion của từng fold trước khi đánh giá"}], "answer": [2], "multi": false, "topic": "Imbalanced Data", "explanation": "SMOTE là bước học từ dữ liệu, nên chỉ áp dụng trên training portion của từng fold; validation fold phải giữ nguyên phân phối gốc để đánh giá trung thực.", "memory": "Không SMOTE trước khi chia fold, không SMOTE validation/test."}]}, {"b": 5, "title": "Deep Learning: Mạng nơ-ron nền tảng ANN/MLP", "sub": "Perceptron, MLP, Activation, Loss, Backpropagation, Optimizer, PyTorch Training Loop và GPU", "summary": "<div class=\"sum-card\"><h3>1. Perceptron và MLP<\/h3><ul><li>Perceptron là một neuron nhân tạo: nhận input, nhân weight, cộng bias rồi qua activation để tạo output.<\/li><li>Công thức trực giác: z = w₁x₁ + … + w_dx_d + b; ŷ = f(z).<\/li><li>MLP gồm nhiều fully-connected layer: input layer, hidden layer và output layer.<\/li><li>Mỗi layer học một phép biến đổi representation; nhiều layer giúp học quan hệ phi tuyến phức tạp hơn.<\/li><li>Độ rộng là số neuron trong hidden layer; độ sâu là số hidden layer.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>2. Activation Function<\/h3><ul><li>Nếu không có activation phi tuyến, nhiều layer tuyến tính vẫn tương đương một phép biến đổi tuyến tính.<\/li><li>Sigmoid cho output trong (0,1), phù hợp diễn giải xác suất binary classification nhưng dễ saturation.<\/li><li>Tanh cho output trong (−1,1), centered quanh 0 hơn Sigmoid nhưng vẫn có thể saturation.<\/li><li>ReLU(x)=max(0,x), tính nhanh và thường dùng ở hidden layer.<\/li><li>Softmax biến logits thành phân phối xác suất nhiều lớp có tổng bằng 1.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>3. Logit, Loss và Metric<\/h3><ul><li>Logit là output thô trước khi đổi sang xác suất; probability là sau Sigmoid/Softmax; prediction là nhãn sau threshold/argmax.<\/li><li>Loss đo mức sai và được optimizer trực tiếp tối ưu; metric dùng đánh giá/báo cáo và không nhất thiết khả vi.<\/li><li>Cross-Entropy dùng phổ biến cho classification; phạt mạnh khi model tự tin nhưng dự đoán sai.<\/li><li>MSE dùng cho regression, phạt mạnh lỗi lớn do bình phương sai số và có thể nhạy với outlier.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>4. Forward, Backpropagation và Optimizer<\/h3><ul><li>Forward propagation: input → linear transformation → activation → output/logits → loss.<\/li><li>Backpropagation tính gradient của loss theo từng parameter bằng chain rule; PyTorch hỗ trợ autograd.<\/li><li>Quy trình học: forward → loss → backward → optimizer step, lặp qua nhiều batch và epoch.<\/li><li>Gradient là hướng tăng nhanh nhất của loss; optimizer đi ngược gradient để giảm loss.<\/li><li>Learning rate quá lớn có thể làm loss dao động/không hội tụ; quá nhỏ làm training rất chậm.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>5. SGD, Adam, Batch và Epoch<\/h3><ul><li>SGD cập nhật parameter theo gradient của từng batch; có thể dùng momentum để ổn định hơn.<\/li><li>Adam kết hợp adaptive learning rate và momentum-like behavior; là lựa chọn mặc định tốt cho nhiều bài DL cơ bản.<\/li><li>Batch là nhóm sample trong một bước update; iteration là một vòng forward/backward/update trên một batch.<\/li><li>Epoch là một lượt đi qua toàn bộ training set.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>6. PyTorch Training Loop<\/h3><ul><li>Tensor là cấu trúc dữ liệu chính trong PyTorch, lưu input, target, parameter và gradient; có thể ở CPU hoặc GPU.<\/li><li>Dataset định nghĩa cách lấy một sample; DataLoader tạo mini-batch, shuffle training data và hỗ trợ nạp dữ liệu.<\/li><li>Model thường kế thừa nn.Module; khai báo layer trong __init__ và định nghĩa forward() trong forward.<\/li><li>Thứ tự training loop: optimizer.zero_grad() → outputs=model(inputs) → tính loss → loss.backward() → optimizer.step().<\/li><li>zero_grad() cần thiết vì PyTorch mặc định cộng dồn gradient qua các lần backward.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>7. Train/Eval, GPU và Debug<\/h3><ul><li>model.train() dùng khi huấn luyện; model.eval() dùng khi evaluation/inference; Dropout và BatchNorm có hành vi khác giữa hai mode.<\/li><li>Khi evaluation thường dùng torch.no_grad() để tiết kiệm bộ nhớ và không tính gradient.<\/li><li>Model, input và target phải ở cùng device; lỗi phổ biến là model ở GPU nhưng tensor vẫn ở CPU.<\/li><li>GPU phù hợp cho phép nhân ma trận song song trên tensor lớn; batch size quá lớn có thể gây hết bộ nhớ GPU.<\/li><li>Checklist debug: shape input, target dtype, loss-output compatibility, scaling, device và learning rate.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>8. MLP cho Churn và Baseline<\/h3><ul><li>Churn là binary classification; có thể dùng 1 output logit với BCE-style loss hoặc 2 logits với CrossEntropyLoss.<\/li><li>MLP nhạy với scale và kiểu dữ liệu: cần encode categorical, scale numerical, xử lý missing và split trước khi fit scaler.<\/li><li>Loss giảm dần là dấu hiệu model đang học; train loss giảm nhưng validation kém có thể là overfitting.<\/li><li>MLP không tự động tốt hơn XGBoost/Random Forest trên tabular data; phải so sánh cùng split và cùng metric.<\/li><\/ul><\/div>", "questions": [{"n": 1, "text": "Trong một neuron nhân tạo, weight có vai trò chính nào?", "options": [{"text": "Quyết định số lượng sample được đưa vào mỗi batch"}, {"text": "Biểu diễn mức ảnh hưởng của từng feature đầu vào"}, {"text": "Quyết định số lượng layer được sử dụng trong mạng"}, {"text": "Biểu diễn mức sai số của prediction so với target"}], "answer": [1], "multi": false, "topic": "Perceptron & MLP", "explanation": "Weight thể hiện mức ảnh hưởng của từng feature đầu vào lên output của neuron (z = wᵀx + b).", "memory": ""}, {"n": 2, "text": "Trong MLP cơ bản, activation ReLU thường được sử dụng ở đâu?", "options": [{"text": "Ở output layer của bài toán multi-class classification"}, {"text": "Ở hidden layer để giúp mô hình học quan hệ phi tuyến"}, {"text": "Ở output layer của bài toán regression giá trị liên tục"}, {"text": "Ở input layer để chuyển feature thành xác suất dự đoán"}], "answer": [1], "multi": false, "topic": "Activation & Loss", "explanation": "ReLU(x)=max(0,x) thường dùng ở hidden layer để mô hình học quan hệ phi tuyến. Output multi-class dùng Softmax; regression thường không dùng activation.", "memory": ""}, {"n": 3, "text": "Loss function có vai trò chính nào trong quá trình huấn luyện neural network?", "options": [{"text": "Đo mức độ phức tạp của network theo số lượng parameter"}, {"text": "Đo mức độ sai của prediction so với target tương ứng"}, {"text": "Đo tốc độ cập nhật parameter sau mỗi lần forward"}, {"text": "Đo số lượng sample được dự đoán đúng trong mỗi batch"}], "answer": [1], "multi": false, "topic": "Activation & Loss", "explanation": "Loss đo mức sai giữa prediction và target, là tín hiệu để backpropagation tính gradient và optimizer cập nhật parameter.", "memory": ""}, {"n": 4, "text": "Trong quá trình training, một epoch được hiểu là gì?", "options": [{"text": "Một lần forward và backward trên đúng một sample"}, {"text": "Một lần cập nhật parameter trên đúng một mini-batch"}, {"text": "Một lượt mô hình đi qua toàn bộ training set"}, {"text": "Một lượt mô hình tính prediction trên validation set"}], "answer": [2], "multi": false, "topic": "PyTorch Training Loop", "explanation": "Epoch là một lượt mô hình đi qua toàn bộ training set. Một lần cập nhật trên một mini-batch là iteration.", "memory": "Số iteration/epoch = số sample / batch size."}, {"n": 5, "text": "Trong PyTorch, vì sao thường cần gọi optimizer.zero_grad() trước khi thực hiện backward cho batch mới?", "options": [{"text": "Vì PyTorch tự xóa toàn bộ weight sau mỗi lần backward"}, {"text": "Vì PyTorch mặc định cộng dồn gradient qua các lần backward"}, {"text": "Vì PyTorch chỉ tính gradient nếu parameter đang bằng không"}, {"text": "Vì PyTorch cần đặt loss về không trước khi thực hiện forward"}], "answer": [1], "multi": false, "topic": "PyTorch Training Loop", "explanation": "PyTorch mặc định cộng dồn gradient qua các lần backward; không zero_grad thì gradient cũ cộng vào và update sai.", "memory": "zero_grad → forward → loss → backward → step."}]}, {"b": 6, "title": "Regularization và CNN cho xử lý ảnh", "sub": "Dropout, Batch Normalization, Early Stopping, Weight Decay, Data Augmentation, CNN, Pooling và Transfer Learning", "summary": "<div class=\"sum-card\"><h3>1. Overfitting trong Deep Learning<\/h3><ul><li>Overfitting thường xuất hiện khi training loss tiếp tục giảm nhưng validation loss bắt đầu tăng và khoảng cách train–validation ngày càng lớn.<\/li><li>Deep Learning dễ overfit vì có nhiều tham số, dữ liệu ảnh có thể ít/nhiễu/lệch lớp và training quá lâu có thể khiến model ghi nhớ chi tiết riêng của train set.<\/li><li>Kiến trúc tốt chưa đủ; cách huấn luyện, validation split và kiểm soát overfitting quyết định chất lượng thực tế.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>2. Dropout, BatchNorm, Early Stopping, Weight Decay<\/h3><ul><li>Dropout ngẫu nhiên vô hiệu hóa một tỷ lệ neuron trong training; inference thì Dropout được tắt.<\/li><li>Inverted dropout dùng q=1−p và scale activation bởi 1/q để giữ kỳ vọng gần như không đổi giữa train và inference.<\/li><li>BatchNorm chuẩn hóa activation theo thống kê mini-batch rồi áp dụng scale γ và shift β; trong eval dùng running statistics.<\/li><li>Early Stopping theo dõi validation metric/loss; patience là số epoch chờ trước khi dừng, best checkpoint là model tốt nhất trên validation.<\/li><li>Weight Decay phạt weight lớn, liên hệ với L2 regularization; AdamW thực hiện weight decay tách biệt khỏi gradient loss.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>3. Data Augmentation<\/h3><ul><li>Data augmentation tạo các biến thể hợp lý của ảnh training để tăng độ bền với góc chụp, kích thước, ánh sáng và vị trí vật thể.<\/li><li>Random augmentation chỉ áp dụng cho training set; validation/test nên dùng transform xác định để đánh giá công bằng.<\/li><li>Augmentation phải giữ nguyên nhãn; biến đổi không phù hợp có thể tạo ảnh không thực tế hoặc gây leakage.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>4. CNN và Convolution<\/h3><ul><li>CNN giữ cấu trúc không gian của ảnh, học local pattern qua filter và chia sẻ weight trên toàn ảnh.<\/li><li>Ảnh RGB thường biểu diễn H×W×3; PyTorch dùng tensor C×H×W.<\/li><li>Convolution đặt kernel lên vùng nhỏ, nhân từng phần tử tương ứng rồi cộng lại để tạo feature map.<\/li><li>Mỗi filter tạo một feature map; nhiều filter tạo nhiều feature map.<\/li><li>CNN tiết kiệm tham số nhờ local connectivity và weight sharing.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>5. Stride, Padding, Pooling và Tensor Shape<\/h3><ul><li>Stride là số pixel kernel di chuyển sau mỗi bước; stride lớn giảm kích thước output nhanh hơn.<\/li><li>Padding thêm pixel ở biên; kernel 3×3, padding=1, stride=1 thường giữ nguyên H/W.<\/li><li>Kích thước output: floor((N+2P−K)/S)+1.<\/li><li>Pooling giảm spatial dimension; MaxPool giữ giá trị lớn nhất, AveragePool lấy trung bình.<\/li><li>Khi thiết kế CNN cần luôn theo dõi kích thước C×H×W sau mỗi layer.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>6. Classification Head &amp; Loss<\/h3><ul><li>Classification head biến representation cuối thành prediction; output dimension thường bằng số class.<\/li><li>Multi-class classification thường dùng logits + Cross-Entropy Loss; Softmax chỉ cần để diễn giải xác suất khi inference/đánh giá.<\/li><li>Global Average Pooling biến mỗi channel thành một giá trị và giảm mạnh số tham số so với Flatten + FC lớn.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>7. Transfer Learning<\/h3><ul><li>Transfer Learning dùng model pre-trained trên dataset lớn, tái sử dụng backbone và thay/fine-tune classification head cho task mới.<\/li><li>Feature extractor: freeze backbone, chỉ train head; nhanh, ít overfit, phù hợp dữ liệu ít.<\/li><li>Fine-tuning: mở một phần/toàn backbone, thường dùng learning rate nhỏ hơn head; có thể cải thiện nếu domain mới khác nhưng dễ overfit nếu dữ liệu ít/lr quá cao.<\/li><li>Quy trình khuyến nghị: load backbone → thay head → freeze/train head → đánh giá → unfreeze một số layer → fine-tune lr nhỏ.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>8. GPU, Metrics và Debug<\/h3><ul><li>CNN xử lý tensor lớn nên GPU giúp tăng tốc; model, input và target phải cùng device.<\/li><li>Metric image classification: Accuracy, Precision, Recall, F1, confusion matrix và per-class performance.<\/li><li>Checklist báo cáo: split không leakage, transform train khác validation/test, best checkpoint, so sánh from-scratch vs transfer learning và phân tích ảnh dự đoán sai.<\/li><\/ul><\/div>", "questions": [{"n": 1, "text": "Dấu hiệu nào thường cho thấy mô hình Deep Learning đang bị overfitting?", "options": [{"text": "Training loss và validation loss cùng giảm đều theo epoch"}, {"text": "Training loss tiếp tục giảm nhưng validation loss bắt đầu tăng"}, {"text": "Training loss bắt đầu tăng nhưng validation loss tiếp tục giảm"}, {"text": "Training loss và validation loss cùng giữ ổn định theo epoch"}], "answer": [1], "multi": false, "topic": "Regularization trong DL", "explanation": "Dấu hiệu overfitting: training loss tiếp tục giảm nhưng validation loss bắt đầu tăng, khoảng cách ngày càng lớn.", "memory": ""}, {"n": 2, "text": "Trong quá trình training, Dropout hoạt động theo cách nào?", "options": [{"text": "Giữ toàn bộ neuron nhưng giảm đồng đều giá trị activation"}, {"text": "Ngẫu nhiên vô hiệu hóa một tỷ lệ neuron trong mỗi lần training"}, {"text": "Loại bỏ cố định một tỷ lệ neuron khỏi kiến trúc của mô hình"}, {"text": "Tăng ngẫu nhiên một tỷ lệ neuron trong mỗi lần training"}], "answer": [1], "multi": false, "topic": "Regularization trong DL", "explanation": "Dropout ngẫu nhiên vô hiệu hóa tạm thời một tỷ lệ neuron trong mỗi lần training; khi evaluation/inference Dropout được tắt.", "memory": ""}, {"n": 3, "text": "Data Augmentation nên được áp dụng như thế nào để đánh giá mô hình công bằng?", "options": [{"text": "Áp dụng biến đổi ngẫu nhiên cho train, dùng transform xác định cho validation/test"}, {"text": "Áp dụng biến đổi ngẫu nhiên cho train và validation, giữ nguyên test"}, {"text": "Áp dụng biến đổi ngẫu nhiên cho cả train, validation và test"}, {"text": "Giữ nguyên train, áp dụng biến đổi ngẫu nhiên cho validation/test"}], "answer": [0], "multi": false, "topic": "Regularization trong DL", "explanation": "Random augmentation chỉ áp dụng cho train; validation/test dùng transform xác định để đánh giá công bằng và nhất quán.", "memory": ""}, {"n": 4, "text": "Trong CNN, một filter thường tạo ra kết quả nào sau khi trượt trên input?", "options": [{"text": "Một weight duy nhất biểu diễn toàn bộ thông tin của ảnh đầu vào"}, {"text": "Một feature map thể hiện mức xuất hiện của pattern tại các vị trí"}, {"text": "Một class label thể hiện nhóm đối tượng xuất hiện trong ảnh đầu vào"}, {"text": "Một loss value thể hiện mức sai lệch của prediction trên toàn ảnh"}], "answer": [1], "multi": false, "topic": "CNN", "explanation": "Mỗi filter trượt trên input tạo ra một feature map cho biết pattern mà filter học được xuất hiện mạnh/yếu ở các vị trí.", "memory": ""}, {"n": 5, "text": "Một CNN có sử dụng cả Dropout và Batch Normalization. Khi đánh giá trên validation set, điều gì có thể xảy ra nếu quên gọi model.eval()?", "options": [{"text": "Dropout bị tắt nhưng BatchNorm vẫn dùng thống kê của mini-batch"}, {"text": "Dropout vẫn hoạt động và BatchNorm vẫn dùng thống kê của mini-batch"}, {"text": "Dropout vẫn hoạt động nhưng BatchNorm chuyển sang dùng running statistics"}, {"text": "Dropout bị tắt và BatchNorm chuyển sang dùng running statistics"}], "answer": [1], "multi": false, "topic": "CNN", "explanation": "Nếu quên model.eval(), model vẫn ở train mode: Dropout vẫn ngẫu nhiên tắt neuron và BatchNorm vẫn dùng thống kê mini-batch thay vì running statistics, khiến kết quả validation sai lệch.", "memory": "Evaluation: model.eval() + torch.no_grad()."}]}, {"b": 7, "title": "RNN/LSTM cho dữ liệu chuỗi thời gian", "sub": "Sequential dependency, RNN, LSTM, Windowing, Time-based Split, Forecasting 24 giờ và PyTorch/GPU", "summary": "<div class=\"sum-card\"><h3>1. Time Series &amp; Sequential Dependency<\/h3><ul><li>Dữ liệu chuỗi thời gian có thứ tự; vị trí theo timeline và ngữ cảnh trước đó có ý nghĩa.<\/li><li>Time series không nên shuffle bừa bãi như tabular thông thường vì quan sát sau có thể phụ thuộc quan sát trước.<\/li><li>Ba dạng bài toán: forecasting, sequence classification và sequence labeling.<\/li><li>Lookback window là số bước quá khứ đưa vào model; forecast horizon là số bước tương lai cần dự báo.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>2. Chuẩn bị dữ liệu Time Series<\/h3><ul><li>Quy trình: Load → sort timestamp → kiểm tra missing → time-based split → scale → window.<\/li><li>Phải sort theo timestamp trước khi split hoặc tạo window; sai thứ tự có thể làm model học quan hệ giả.<\/li><li>Phân biệt missing value và missing timestamp; missing timestamp có thể phá cấu trúc thời gian đều.<\/li><li>Scaler chỉ fit trên train, sau đó transform validation/test để tránh leakage.<\/li><li>Time-based split: dùng quá khứ làm train, tương lai làm validation/test; ví dụ 70%–15%–15%.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>3. Windowing &amp; Input Shape<\/h3><ul><li>Windowing biến một chuỗi dài thành nhiều sample: đoạn quá khứ làm input, đoạn tương lai làm target.<\/li><li>Windowing quyết định model nhìn bao xa về quá khứ; horizon quyết định model dự báo bao xa về tương lai.<\/li><li>Với PyTorch và batch_first=True, input LSTM thường có shape [batch_size, seq_length, input_size].<\/li><li>batch_size là số window trong batch, seq_length là độ dài lookback, input_size là số feature tại mỗi time step.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>4. RNN<\/h3><ul><li>RNN xử lý từng time step và duy trì hidden state để truyền thông tin từ quá khứ sang hiện tại.<\/li><li>Cùng một recurrent cell được dùng lặp lại qua nhiều time step.<\/li><li>Many-to-one: chuỗi → một nhãn/giá trị; many-to-many: chuỗi → chuỗi.<\/li><li>RNN cơ bản khó học dependency dài vì hidden state có thể thành bottleneck và gradient dễ vanishing/exploding.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>5. LSTM<\/h3><ul><li>LSTM bổ sung memory cell và các gate để kiểm soát thông tin cần giữ, ghi thêm hoặc đưa ra output.<\/li><li>Forget gate: giữ/bỏ thông tin cũ; Input gate: quyết định thông tin mới ghi vào cell state; Output gate: quyết định phần memory ảnh hưởng hidden state/output.<\/li><li>Cell state là đường truyền thông tin dài hạn; hidden state là biểu diễn được truyền sang bước tiếp theo và có thể dùng cho output.<\/li><li>LSTM phù hợp khi dữ liệu có sequential dependency rõ ràng và trạng thái hiện tại phụ thuộc quá khứ gần hoặc xa.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>6. LSTM Forecasting Architecture<\/h3><ul><li>Pipeline cơ bản: Input sequence → LSTM layer → hidden state → Fully Connected → Forecast.<\/li><li>input_size = số feature/time step; hidden_size = kích thước hidden state; num_layers = số lớp LSTM xếp chồng.<\/li><li>hidden_size quá nhỏ dễ underfit; quá lớn dễ overfit và tốn tài nguyên.<\/li><li>Một LSTM layer thường đủ làm baseline ban đầu; nhiều layer phức tạp hơn nhưng khó train và dễ overfit hơn.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>7. Forecasting, Baseline &amp; Metrics<\/h3><ul><li>MSELoss thường dùng để train regression; MAE dễ diễn giải; RMSE phạt lỗi lớn mạnh hơn.<\/li><li>Không nên dùng LSTM mà không có baseline; baseline có thể là giá trị gần nhất, trung bình 24 giờ, hoặc cùng giờ ngày trước.<\/li><li>Naive forecast: dự báo bước tiếp theo bằng giá trị gần nhất. Seasonal baseline phù hợp khi chuỗi có chu kỳ ngày/tuần.<\/li><li>Nên plot Actual vs Prediction để xem model có bám xu hướng, bỏ lỡ spike/dip hay không.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>8. Leakage, Feature Engineering &amp; GPU<\/h3><ul><li>Leakage thường gặp: shuffle trước split, fit scaler trên toàn chuỗi, dùng feature tương lai, rolling statistic nhìn cả tương lai, tuning test quá nhiều lần.<\/li><li>Nguyên tắc: tại thời điểm dự báo, model chỉ được dùng thông tin đã tồn tại trong quá khứ.<\/li><li>Feature engineering có thể gồm lag features, rolling mean/median/std, calendar features và event flags.<\/li><li>GPU training: kiểm
