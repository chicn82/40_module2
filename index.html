const LETTERS='ABCDEF';
const Q=[];DATA.forEach(s=>s.questions.forEach(q=>Q.push(Object.assign({},q,{b:s.b,uid:s.b+'-'+q.n}))));
const BYID=Object.fromEntries(Q.map(q=>[q.uid,q]));
const SESS=Object.fromEntries(DATA.map(s=>[s.b,s]));
const KEY='ml_dl_module2_onthi_40_v1';
const $=id=>document.getElementById(id);
function fresh(){return{mode:'practice',shuffleOpts:true,perm:{},practice:{answers:{},checked:{},flagged:{},order:null,started:Date.now()},exam:null,reveal:false}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.practice)return Object.assign(fresh(),x)}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
let state=load();
const ui={sess:'all',topic:'all',filter:'all',term:'',wrongOnly:false};
let currentIds=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
const inExam=()=>state.mode==='exam'&&!!state.exam;
const examLive=()=>inExam()&&!state.exam.submitted;
const store=()=>inExam()?state.exam:state.practice;
function permFor(q){if(!inExam()&&!state.shuffleOpts)return q.options.map((_,i)=>i);let p=state.perm[q.uid];if(!p||p.length!==q.options.length){p=shuffle(q.options.map((_,i)=>i));state.perm[q.uid]=p}return p}
const sel=(st,uid)=>(st.answers[uid]||[]).map(Number);
function sameSet(a,b){const x=[...a].sort((m,n)=>m-n),y=[...b].sort((m,n)=>m-n);return x.length===y.length&&x.every((v,i)=>v===y[i])}
const answered=(st,q)=>sel(st,q.uid).length>0;
const isCorrect=(st,q)=>sameSet(sel(st,q.uid),q.answer);
function answerLabel(q){const p=permFor(q);return q.answer.map(i=>LETTERS[p.indexOf(i)]).sort().join(', ')}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return[Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(x=>String(x).padStart(2,'0')).join(':')}

/* ---------- danh sách câu đang xem ---------- */
function viewIds(){
 if(state.mode==='exam'){if(!state.exam)return[];let ids=state.exam.ids;if(ui.wrongOnly&&state.exam.submitted)ids=ids.filter(u=>!isCorrect(state.exam,BYID[u]));return ids}
 const st=state.practice,t=ui.term.trim().toLowerCase();
 return(st.order||Q.map(q=>q.uid)).filter(u=>{const q=BYID[u];
  if(ui.sess!=='all'&&String(q.b)!==ui.sess)return false;
  if(ui.topic!=='all'&&q.topic!==ui.topic)return false;
  if(t&&!(q.text+' '+q.options.map(o=>o.text).join(' ')+' '+q.topic+' '+q.explanation).toLowerCase().includes(t))return false;
  switch(ui.filter){case'unanswered':return!answered(st,q);case'wrong':return!!st.checked[u]&&!isCorrect(st,q);case'flagged':return!!st.flagged[u];case'multi':return q.multi;case'unchecked':return!st.checked[u]}
  return true})
}

/* ---------- thẻ câu hỏi ---------- */
function cardHTML(q,idx){
 const st=store(),p=permFor(q),s=sel(st,q.uid),chk=!!st.checked[q.uid],rev=state.reveal&&!inExam(),lock=inExam()&&state.exam.submitted;
 let ops='';
 p.forEach((i,pos)=>{const ck=s.includes(i);let cls=ck?' selected':'';
  if(chk||rev){if(q.answer.includes(i))cls+=' correct';if(chk&&ck&&!q.answer.includes(i))cls+=' wrong'}
  ops+=`<label class="option${cls}"><input type="${q.multi?'checkbox':'radio'}" name="q${q.uid}" value="${i}" ${ck?'checked':''} ${lock?'disabled':''}><span class="letter">${LETTERS[pos]}.</span><span>${esc(q.options[i].text)}</span></label>`});
 const det=`<div class="explain">${esc(q.explanation)}</div>${q.memory?`<div class="memory"><b>Cần nhớ:</b> ${esc(q.memory)}</div>`:''}`;
 let fb='';
 if(chk){const ok=isCorrect(st,q);fb=!answered(st,q)?`<div class="feedback bad"><b>Chưa trả lời – đáp án ${answerLabel(q)}.</b>${det}</div>`:ok?`<div class="feedback ok"><b>Chính xác – đáp án ${answerLabel(q)}.</b>${det}</div>`:`<div class="feedback bad"><b>Chưa chính xác – đáp án ${answerLabel(q)}.</b>${det}</div>`}
 else if(rev)fb=`<div class="feedback info"><b>Đáp án ${answerLabel(q)}.</b>${det}</div>`;
 const flagBtn=`<button class="btn ghost" data-act="flag" data-uid="${q.uid}">${st.flagged[q.uid]?'★ Bỏ đánh dấu':'☆ Đánh dấu'}</button>`;
 const actions=inExam()?flagBtn:`<button class="btn" data-act="check" data-uid="${q.uid}">Kiểm tra câu này</button>${flagBtn}`;
 return `<div class="qhead"><div class="qnum">${idx}</div><div><div class="qtitle">${esc(q.text)}</div><div class="tags"><span class="tag sess">Buổi ${q.b} · Câu ${q.n}</span><span class="tag">${q.multi?'Chọn nhiều đáp án':'Chọn một đáp án'}</span><span class="tag">${esc(q.topic)}</span></div></div></div><div class="options">${ops}</div>${lock?'':`<div class="qactions">${actions}</div>`}${fb}`;
}
function renderList(){
 currentIds=viewIds();
 const list=$('questionList');
 if(state.mode==='exam'&&!state.exam){list.innerHTML='';updateUI();return}
 list.innerHTML=currentIds.length?currentIds.map((u,i)=>`<section class="card" id="q-${u}">${cardHTML(BYID[u],i+1)}</section>`).join(''):'<div class="empty">Không có câu hỏi phù hợp với bộ lọc hiện tại.</div>';
 save();updateUI();
}
function renderCard(uid){const el=$('q-'+uid);if(el)el.innerHTML=cardHTML(BYID[uid],currentIds.indexOf(uid)+1)}

/* ---------- thanh tiến độ, điều hướng, thống kê ---------- */
function updateUI(){
 const st=store(),qs=currentIds.map(u=>BYID[u]);
 const a=qs.filter(q=>answered(st,q)).length,checked=qs.filter(q=>st.checked[q.uid]),w=checked.filter(q=>!isCorrect(st,q)).length;
 $('progressbar').style.width=(qs.length?a/qs.length*100:0)+'%';
 $('navCount').textContent=qs.length?`(${qs.length} câu)`:'';
 const nav=$('navgrid');
 nav.innerHTML=qs.map((q,i)=>{let c='navbtn';if(answered(st,q))c+=' answered';if(st.checked[q.uid])c+=isCorrect(st,q)?' correct':' wrong';if(st.flagged[q.uid])c+=' flagged';return`<button class="${c}" data-go="${q.uid}" title="Buổi ${q.b} · Câu ${q.n}">${i+1}</button>`}).join('');
 const footer=$('footer'),btn=$('submitBottom');
 if(state.mode==='exam'){
  if(!state.exam){footer.classList.add('hidden');$('stats').innerHTML='Chưa có đề. Chọn buổi, số câu và bấm <b>Bắt đầu thi</b>.';return}
  footer.classList.remove('hidden');
  const ex=state.exam,tot=ex.ids.length,ea=ex.ids.filter(u=>answered(ex,BYID[u])).length;
  $('liveResult').innerHTML=ex.submitted?`<b>Đã nộp bài: ${ex.ids.filter(u=>isCorrect(ex,BYID[u])).length}/${tot} câu đúng</b>`:`<b>Đã trả lời ${ea}/${tot} câu</b>`;
  btn.textContent=ex.submitted?'Xem kết quả':'Nộp bài';
  $('stats').innerHTML=`Đề gồm <b>${tot}</b> câu từ buổi ${ex.sessions.join(', ')}<br>Đã trả lời: <b>${ea}</b><br>Đánh dấu: <b>${ex.ids.filter(u=>ex.flagged[u]).length}</b>`;
 }else{
  footer.classList.remove('hidden');
  $('liveResult').innerHTML=`<b>Đã trả lời ${a}/${qs.length} câu đang xem</b>`;
  btn.textContent=`Chấm điểm ${qs.length} câu đang xem`;
  const pa=Q.filter(q=>answered(st,q)).length,pc=Q.filter(q=>st.checked[q.uid]&&isCorrect(st,q)).length;
  $('stats').innerHTML=`Đang xem: <b>${qs.length}</b> câu · đã trả lời <b>${a}</b> · sai <b>${w}</b><br>Toàn bộ đề: đã trả lời <b>${pa}/${Q.length}</b> · đúng (đã kiểm tra) <b>${pc}</b>`;
  renderSessGrid();
 }
}
function renderSessGrid(){
 const st=state.practice;
 const card=(key,label,title,qs)=>{const a=qs.filter(q=>answered(st,q)).length,ck=qs.filter(q=>st.checked[q.uid]),c=ck.filter(q=>isCorrect(st,q)).length;
  return`<button class="sesscard${ui.sess===key?' on':''}" data-sess="${key}"><div class="k">${label}</div><div class="t">${esc(title)}</div><span class="mini-bar"><span class="mini-fill" style="width:${a/qs.length*100}%"></span></span><div class="m">Đã làm ${a}/${qs.length}${ck.length?` · đúng ${c}/${ck.length}`:''}</div></button>`};
 $('sessGrid').innerHTML=card('all','Tất cả','Toàn bộ '+DATA.length+' buổi',Q)+DATA.map(s=>card(String(s.b),'Buổi '+s.b,s.title,Q.filter(q=>q.b===s.b))).join('');
}

/* ---------- phần tóm tắt & điều khiển ---------- */
function renderSummary(){
 const one=s=>`<details class="sumd"${ui.sess!=='all'?' open':''}><summary>Buổi ${s.b} – ${esc(s.title)}</summary><div class="summary-grid">${s.summary}</div></details>`;
 $('summary').innerHTML=`<h2>Nội dung cần nhớ</h2>`+(ui.sess==='all'?DATA.map(one).join(''):one(SESS[+ui.sess]));
}
function fillSelects(){
 $('sessSelect').innerHTML=`<option value="all">Tất cả ${DATA.length} buổi (${Q.length} câu)</option>`+DATA.map(s=>`<option value="${s.b}">Buổi ${s.b} – ${esc(s.title)}</option>`).join('');
 $('sessSelect').value=ui.sess;
 const src=ui.sess==='all'?DATA:[SESS[+ui.sess]];
 let opts='<option value="all">Tất cả chủ đề</option>';
 src.forEach(s=>{[...new Set(s.questions.map(q=>q.topic))].forEach(t=>{opts+=`<option value="${esc(t)}">${ui.sess==='all'?'B'+s.b+' · ':''}${esc(t)}</option>`})});
 $('topicSelect').innerHTML=opts;$('topicSelect').value=ui.topic;
}
function renderToolbar(){
 const tb=$('toolbar');
 if(state.mode==='practice'){
  tb.innerHTML=`<button class="btn primary" data-tb="grade">Chấm phần đang xem</button><button class="btn" data-tb="reveal">${state.reveal?'Ẩn đáp án':'Hiện đáp án'}</button><button class="btn" data-tb="shuffle">Trộn thứ tự câu</button><button class="btn ghost" data-tb="orig">Thứ tự gốc</button><button class="btn danger" data-tb="reset">Làm lại phần đang xem</button>`;
 }else if(state.exam){
  tb.innerHTML=state.exam.submitted?`<button class="btn primary" data-tb="result">Xem kết quả</button><button class="btn ${ui.wrongOnly?'active':''}" data-tb="wrongOnly">${ui.wrongOnly?'Hiện tất cả câu':'Chỉ xem câu sai'}</button><button class="btn" data-tb="newExam">Làm đề mới</button>`:`<button class="btn primary" data-tb="submit">Nộp bài</button><button class="btn danger" data-tb="cancel">Hủy đề</button>`;
 }else tb.innerHTML='';
}
function renderAll(){
 document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===state.mode));
 const pr=state.mode==='practice';
 $('practiceCtl').classList.toggle('hidden',!pr);$('practiceTop').classList.toggle('hidden',!pr);
 $('examSetup').classList.toggle('hidden',pr||!!state.exam);
 if(pr){
  if(ui.sess==='all'){$('heroTitle').textContent='Câu hỏi ôn thi Module 2';$('heroSub').textContent=`${Q.length} câu trắc nghiệm từ Buổi 1–${DATA.length} • Mỗi câu có đáp án và giải thích • Lọc theo buổi/chủ đề • Trộn đáp án • Thi thử có đồng hồ • Lưu tiến độ, hoạt động offline. Đề gốc không kèm đáp án; đáp án và giải thích được biên soạn theo nội dung bài giảng.`}
  else{const s=SESS[+ui.sess];$('heroTitle').textContent=`Buổi ${s.b} – ${s.title}`;$('heroSub').textContent=`${s.sub} • ${s.questions.length} câu trắc nghiệm`}
  fillSelects();renderSummary();
 }else{$('heroTitle').textContent='Thi thử tổng hợp';$('heroSub').textContent=state.exam?`${state.exam.ids.length} câu ngẫu nhiên từ buổi ${state.exam.sessions.join(', ')}${state.exam.submitted?' • Đã nộp bài':''}`:'Rút ngẫu nhiên câu hỏi từ các buổi bạn chọn, có đồng hồ đếm ngược và chấm điểm theo từng buổi.'}
 $('shuffleOpts').checked=state.shuffleOpts;
 renderToolbar();renderList();tick();
}

/* ---------- chấm điểm ---------- */
function showResult(ids,st,title){
 const qs=ids.map(u=>BYID[u]),c=qs.filter(q=>isCorrect(st,q)).length,b=qs.filter(q=>!answered(st,q)).length,w=qs.length-c-b,p=qs.length?Math.round(c/qs.length*100):0;
 $('resultTitle').textContent=title;
 $('correctCount').textContent=c;$('wrongCount').textContent=w;$('blankCount').textContent=b;
 $('scoreinner').innerHTML=`${p}%<br><small style="font-size:12px;font-weight:600">${c}/${qs.length}</small>`;
 $('scorecircle').style.background=`conic-gradient(var(--primary) ${p*3.6}deg,#e9eef6 0deg)`;
 $('resultMessage').textContent=p>=80?'Nắm khá chắc. Dùng "Xem lại câu sai" để ôn điểm yếu.':p>=60?'Đã nắm phần lớn nội dung; nên ôn lại các buổi/chủ đề có tỷ lệ thấp.':'Nên đọc lại phần Nội dung cần nhớ rồi làm lại theo từng buổi.';
 const multiSess=new Set(qs.map(q=>q.b)).size>1;
 const groups=new Map();[...qs].sort((x,y)=>x.b-y.b).forEach(q=>{const k=multiSess?'Buổi '+q.b+' – '+SESS[q.b].title:q.topic;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(q)});
 let s=`<h3>Kết quả theo ${multiSess?'buổi':'chủ đề'}</h3>`;
 groups.forEach((g,k)=>{const cc=g.filter(q=>isCorrect(st,q)).length,pp=Math.round(cc/g.length*100);s+=`<div class="topic-row"><span>${esc(k)}</span><span class="mini-bar"><span class="mini-fill" style="width:${pp}%;background:${pp>=80?'var(--ok)':pp>=60?'var(--primary)':'var(--bad)'}"></span></span><b>${cc}/${g.length}</b></div>`});
 $('topicResults').innerHTML=s;$('resultModal').classList.add('show');
}
function gradePractice(){const st=state.practice;if(!currentIds.length)return;currentIds.forEach(u=>st.checked[u]=true);const ids=[...currentIds];renderList();showResult(ids,st,'Kết quả phần đang xem')}
function submitExam(auto){const ex=state.exam;if(!ex||ex.submitted)return;
 if(!auto){const left=ex.ids.filter(u=>!answered(ex,BYID[u])).length;if(left&&!confirm(`Còn ${left} câu chưa trả lời. Nộp bài?`))return}
 ex.ids.forEach(u=>ex.checked[u]=true);ex.submitted=true;ex.ended=Date.now();save();renderAll();showResult(ex.ids,ex,auto?'Hết giờ – kết quả bài thi':'Kết quả bài thi')}
function startExam(){
 const bs=[...document.querySelectorAll('#examChips input:checked')].map(x=>+x.value);
 if(!bs.length){alert('Hãy chọn ít nhất một buổi.');return}
 const n=+$('examCount').value,per=+$('examTime').value;
 const pools=bs.map(b=>shuffle(Q.filter(q=>q.b===b).map(q=>q.uid)));
 let ids=[],i=0;while(ids.length<n&&pools.some(p=>p.length)){const p=pools[i%pools.length];if(p.length)ids.push(p.pop());i++}
 ids=shuffle(ids);ids.forEach(u=>{state.perm[u]=shuffle(BYID[u].options.map((_,k)=>k))});
 state.exam={ids,answers:{},checked:{},flagged:{},sessions:bs,started:Date.now(),duration:per?ids.length*per:0,submitted:false};
 ui.wrongOnly=false;save();renderAll();window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- sự kiện ---------- */
$('questionList').addEventListener('change',e=>{const inp=e.target;if(!inp.matches('.option input'))return;
 const uid=inp.name.slice(1),q=BYID[uid],st=store();if(inExam()&&state.exam.submitted)return;
 st.answers[uid]=q.multi?[...document.querySelectorAll(`input[name="q${uid}"]:checked`)].map(x=>+x.value):[+inp.value];
 delete st.checked[uid];save();renderCard(uid);updateUI()});
$('questionList').addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const uid=b.dataset.uid,st=store();
 if(b.dataset.act==='check'){if(!sel(st,uid).length){alert('Bạn chưa chọn đáp án.');return}st.checked[uid]=true}else st.flagged[uid]=!st.flagged[uid];
 save();renderCard(uid);updateUI()});
$('navgrid').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)$('q-'+b.dataset.go)?.scrollIntoView({block:'start'})});
$('sessGrid').addEventListener('click',e=>{const b=e.target.closest('[data-sess]');if(!b)return;ui.sess=b.dataset.sess;ui.topic='all';renderAll()});
$('toolbar').addEventListener('click',e=>{const b=e.target.closest('[data-tb]');if(!b)return;const st=state.practice;
 switch(b.dataset.tb){
  case'grade':gradePractice();break;
  case'reveal':state.reveal=!state.reveal;save();renderToolbar();renderList();break;
  case'shuffle':st.order=shuffle(Q.map(q=>q.uid));save();renderList();break;
  case'orig':st.order=null;save();renderList();break;
  case'reset':if(!confirm(`Xóa đáp án, kết quả kiểm tra và đánh dấu của ${currentIds.length} câu đang xem?`))return;currentIds.forEach(u=>{delete st.answers[u];delete st.checked[u];delete st.flagged[u]});st.started=Date.now();save();renderList();break;
  case'submit':submitExam(false);break;
  case'cancel':if(confirm('Hủy đề đang làm?')){state.exam=null;save();renderAll()}break;
  case'result':showResult(state.exam.ids,state.exam,'Kết quả bài thi');break;
  case'wrongOnly':ui.wrongOnly=!ui.wrongOnly;renderToolbar();renderList();break;
  case'newExam':state.exam=null;save();renderAll();break;
 }});
$('submitBottom').onclick=()=>{if(state.mode==='practice')gradePractice();else if(state.exam)state.exam.submitted?showResult(state.exam.ids,state.exam,'Kết quả bài thi'):submitExam(false)};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;ui.wrongOnly=false;save();renderAll();window.scrollTo({top:0})});
$('sessSelect').onchange=e=>{ui.sess=e.target.value;ui.topic='all';renderAll()};
$('topicSelect').onchange=e=>{ui.topic=e.target.value;renderList()};
let st0;$('search').addEventListener('input',e=>{clearTimeout(st0);st0=setTimeout(()=>{ui.term=e.target.value;renderList()},180)});
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{ui.filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderList()});
$('shuffleOpts').onchange=e=>{state.shuffleOpts=e.target.checked;save();renderList()};
$('startExam').onclick=startExam;
$('closeModal').onclick=()=>$('resultModal').classList.remove('show');
$('reviewWrong').onclick=()=>{$('resultModal').classList.remove('show');if(state.mode==='exam'){ui.wrongOnly=true;renderToolbar();renderList()}else{ui.filter='wrong';document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter==='wrong'));renderList()}window.scrollTo({top:0})};
$('resultModal').onclick=e=>{if(e.target.id==='resultModal')$('resultModal').classList.remove('show')};
$('examChips').innerHTML=DATA.map(s=>`<label class="chip"><input type="checkbox" value="${s.b}" checked>Buổi ${s.b}</label>`).join('');

/* ---------- đồng hồ ---------- */
function tick(){const t=$('timer');t.classList.remove('warn');
 if(inExam()){const ex=state.exam;
  if(ex.submitted){t.textContent=fmt(((ex.ended||Date.now())-ex.started)/1000);return}
  if(ex.duration){const left=ex.duration-(Date.now()-ex.started)/1000;t.textContent=fmt(left);if(left<=60)t.classList.add('warn');if(left<=0)submitExam(true)}
  else t.textContent=fmt((Date.now()-ex.started)/1000);
 }else if(state.mode==='exam')t.textContent='00:00:00';
 else t.textContent=fmt((Date.now()-state.practice.started)/1000)}
setInterval(tick,1000);
renderAll();tick();
</script></body></html>
